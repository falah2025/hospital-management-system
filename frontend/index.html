<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="نظام متكامل لإدارة المستشفى - Hospital Management System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>نظام إدارة المستشفى | HMS</title>
    <style>
      /* Splash screen styles */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease;
      }
      #splash-screen.hidden { opacity: 0; pointer-events: none; }
      #splash-screen .logo {
        font-size: 64px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      #splash-screen .title {
        color: white;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      #splash-screen .subtitle {
        color: rgba(255,255,255,0.8);
        font-size: 14px;
      }
      #splash-screen .loader {
        margin-top: 30px;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="logo">🏥</div>
      <div class="title">نظام إدارة المستشفى</div>
      <div class="subtitle">Hospital Management System</div>
      <div class="loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
